# Nginx Server Block Configuration for Single Page Application (SPA)
server {
    # Listen on port 80 for incoming HTTP traffic inside the container
    listen 80;
    
    # Server hostname matching
    server_name localhost;

    # Handle all incoming request routes
    location / {
        # Root directory where compiled static assets (HTML, JS, CSS) are stored
        root /usr/share/nginx/html;
        
        # Default entrypoint files to serve when a directory path is requested
        index index.html index.htm;
        
        # SPA Routing Fallback (React Router / Client-side Routing):
        # 1. $uri   -> Try to serve the exact requested physical file (e.g. /assets/index.js)
        # 2. $uri/  -> Try to serve a matching physical directory
        # 3. /index.html -> If neither exists (e.g. /packages, /vehicles), fallback to index.html 
        #                   so React Router can parse the client-side route natively.
        try_files $uri $uri/ /index.html;
    }
}