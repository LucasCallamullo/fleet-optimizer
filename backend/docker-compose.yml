version: '3.9'

services:
  gateway-service:
    build: ./gateway
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      # Nombres de variables mapeados a los que lee tu application.yml
      - FLEETS_SERVICE_URL=http://fleets-service:8081
      - ROUTES_SERVICE_URL=http://routes-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8083
      - PACKAGES_SERVICE_URL=http://packages-service:8084
      - GEOCODING_SERVICE_URL=http://geocoding-service:8085

      # Keycloak Configuration
      - KEYCLOAK_URI=${KEYCLOAK_URI}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URI}
    depends_on:
      - fleets-service
      - routes-service
      - auth-service
      - packages-service
      - geocoding-service
    networks:
      - backend-network
    restart: unless-stopped

  fleets-service:
    build: ./ms-fleets
    container_name: fleets-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:logisticadb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
    networks:
      - backend-network
    restart: unless-stopped

  routes-service:
    build: ./ms-routes
    container_name: routes-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:routesdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      # Ajustado a los nombres reales que buscan los Feign Clients/WebClient
      - FLEETS_SERVICE_URL=http://fleets-service:8081
      - PACKAGES_SERVICE_URL=http://packages-service:8084
      - GEOCODING_SERVICE_URL=http://geocoding-service:8085
    depends_on:
      - fleets-service
      - packages-service
      - geocoding-service
    networks:
      - backend-network
    restart: unless-stopped

  auth-service:
    build: ./ms-auth
    container_name: auth-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:authdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - KEYCLOAK_URI=${KEYCLOAK_URI}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    networks:
      - backend-network
    restart: unless-stopped

  packages-service:
    build: ./ms-packages
    container_name: packages-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:packagesdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
    networks:
      - backend-network
    restart: unless-stopped

  geocoding-service:
    build: ./ms-geocoding
    container_name: geocoding-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORS_URL=${ORS_URL:-https://api.openrouteservice.org}
      - ORS_API_KEY=${ORS_API_KEY}
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge
    name: fleet-network