server:
  port: 8080

# ================================================================
# KEYCLOAK CONFIGURATION
# ================================================================
# Used for JWT validation and authentication.
# Values can be overridden by environment variables (Docker).
# Default values are for local development with external Keycloak.
# ================================================================
app:
  keycloak:
    # Keycloak server base URL
    # External Keycloak provided by UTN for development
    uri: ${KEYCLOAK_URI:https://labsys.frc.utn.edu.ar/aim}
    
    # Keycloak realm containing users and roles
    realm: ${KEYCLOAK_REALM:dds-materia}
    
    # JWKS URI for JWT validation - fetches public keys automatically
    # Constructed from uri and realm with fallback
    jwks-uri: ${KEYCLOAK_JWKS_URI:${app.keycloak.uri}/realms/${app.keycloak.realm}/protocol/openid-connect/certs}

spring:
  application:
    name: gateway

  cloud:
    globalcors:
      cors-configurations:
        '[/**]':
          allowed-origins:
            - "http://localhost:3000"  # Frontend React
            - "http://localhost:5173"  # Frontend React
            # - "https://dominio.com"  # for Produccion
          allowed-methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "OPTIONS"
          allowed-headers:
            - "Authorization"
            - "Content-Type"
            - "X-Requested-With"
            - "Accept"
            - "Origin"
          allow-credentials: true
          max-age: 3600

    gateway:
      routes:
        # ================================================================
        # FLEETS SERVICE (ms-fleets)
        # ================================================================
        # Port: 8081 (local) / fleets-service:8081 (Docker)
        # Routes: fleet management, vehicles, categories
        # CircuitBreaker: fleetsService with fallback
        # ================================================================
        - id: fleets-service
          uri: ${FLEETS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/fleets/**, /api/v1/vehicles/**, /api/v1/categories/**
          filters:
            - name: CircuitBreaker
              args:
                name: fleetsService
                fallbackUri: forward:/fallback/fleets
            - StripPrefix=0
            - AddRequestHeader=X-Service-Name, fleets-service

        # ================================================================
        # ROUTES SERVICE (ms-routes)
        # ================================================================
        # Port: 8082 (local) / routes-service:8082 (Docker)
        # Routes: route and leg management, shipment orchestration
        # CircuitBreaker: routesService with fallback
        # ================================================================
        - id: routes-service
          uri: ${ROUTES_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/routes/**, /api/v1/legs/**, /api/v1/shipments/**
          filters:
            - name: CircuitBreaker
              args:
                name: routesService
                fallbackUri: forward:/fallback/routes
            - StripPrefix=0
            - AddRequestHeader=X-Service-Name, routes-service

        # ================================================================
        # AUTH SERVICE (ms-auth)
        # ================================================================
        # Port: 8083 (local) / auth-service:8083 (Docker)
        # Routes: authentication, registration, token refresh
        # CircuitBreaker: authService with fallback
        # ================================================================
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/auth/test/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth
            - StripPrefix=0
            - AddRequestHeader=X-Service-Name, auth-service

        # ================================================================
        # PACKAGES SERVICE (ms-packages)
        # ================================================================
        # Port: 8084 (local) / packages-service:8084 (Docker)
        # Routes: package and store management
        # CircuitBreaker: packagesService with fallback
        # ================================================================
        - id: packages-service
          uri: ${PACKAGES_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/packages/**
          filters:
            - name: CircuitBreaker
              args:
                name: packagesService
                fallbackUri: forward:/fallback/packages
            - StripPrefix=0
            - AddRequestHeader=X-Service-Name, packages-service

        # ================================================================
        # GEOCODING SERVICE (ms-geocoding)
        # ================================================================
        # Port: 8085 (local) / geocoding-service:8085 (Docker)
        # Routes: distance calculation via OSRM
        # CircuitBreaker: geocodingService with fallback
        # ================================================================
        - id: geocoding-service
          uri: ${GEOCODING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/distance/**
          filters:
            - name: CircuitBreaker
              args:
                name: geocodingService
                fallbackUri: forward:/fallback/geocoding
            - StripPrefix=0
            - AddRequestHeader=X-Service-Name, geocoding-service

    # ================================================================
    # CIRCUIT BREAKER (Resilience4J)
    # ================================================================
    # Protects system from cascading failures.
    # Enabled globally for all routes using CircuitBreaker filter.
    # ================================================================
    circuitbreaker:
      resilience4j:
        enabled: true

# ================================================================
# ACTUATOR (Monitoring)
# ================================================================
# Exposes endpoints for health checks and Gateway status.
# - health: Application health
# - info: Application information
# - gateway: Route and filter information
# ================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  info:
    env:
      enabled: true

# ================================================================
# LOGGING
# ================================================================
# DEBUG level for Gateway to see routing and request details.
# Useful for debugging routing issues and CircuitBreaker events.
# ================================================================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.fleetoptimizer.gateway: DEBUG

# ================================================================
# RESILIENCE4J CONFIGURATION (Timeouts & Circuit Breakers)
# ================================================================
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s # Eleva el tiempo límite de 1s a 5s para llamadas externas lentas
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s