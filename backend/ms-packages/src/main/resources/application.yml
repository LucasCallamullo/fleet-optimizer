# ================================================================
# APPLICATION - ms-packages (Base configuration)
# ================================================================
# This is the base configuration used for local development.
# Values here are overridden by application-docker.yml when
# the "docker" profile is active.
# ================================================================

server:
  port: 8084

spring:
  application:
    name: ms-packages

  # ================================================================
  # DATASOURCE - H2 for local development
  # ================================================================
  datasource:
    url: jdbc:h2:mem:packagesdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # ================================================================
  # JPA - Hibernate configuration
  # ================================================================
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # ================================================================
  # H2 Console - Enabled for local development
  # ================================================================
  h2:
    console:
      enabled: true
      path: /h2-console

# ================================================================
# LOGGING CONFIGURATION
# ================================================================
# NOTE: File appender is configured but not used by default.
# To enable file logging, uncomment the 'file:' section below.
# ================================================================

logging:
  level:
    com.packages.controller: WARN
    com.packages.filter: INFO

  pattern:
    # Console output format - without %highlight to avoid conflict with filter colors
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %-5level - %msg%n"
    # File output format (more detailed for debugging)
    file: "%d{yyyy-MM-dd HH:mm:ss} - %level - [%thread] - %logger{36} - %msg%n%n"

  # ================================================================
  # FILE APPENDER (Persistent logs)
  # ================================================================
  # Commented out by default - uncomment to enable file logging.
  # Writes logs to a file for long-term storage and debugging.
  # ================================================================
  # file:
  #   name: logs/ms-packages.log
  #   max-size: 10MB
  #   max-history: 7