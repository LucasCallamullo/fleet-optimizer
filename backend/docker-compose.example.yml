# ================================================================
# DOCKER COMPOSE - Fleet Optimization System
# ================================================================
# Version: 3.9
# Description: Orchestrates all microservices for the fleet management system
# 
# How to use:
#   1. Build images: docker-compose build
#   2. Start services: docker-compose up -d
#   3. View logs: docker-compose logs -f
#   4. Stop services: docker-compose down
#
# Access points:
#   - API Gateway: http://localhost:8080
#   - Swagger (each MS): http://localhost:8081/swagger-ui.html
#   - H2 Console (routes): http://localhost:8082/h2-console
# ================================================================

version: '3.9'

services:
  
  # ================================================================
  # 1. API GATEWAY (Single Entry Point)
  # ================================================================
  # Responsibilities:
  #   - Route requests to microservices
  #   - Authentication (JWT)
  #   - Rate limiting
  #   - Request/response logging
  # ================================================================
  gateway-service:
    build: 
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - APP_FLEETS_URL=${FLEETS_SERVICE_URL}
      - APP_ROUTES_URL=${ROUTES_SERVICE_URL}
      - APP_AUTH_URL=${AUTH_SERVICE_URL}
      - APP_PACKAGES_URL=${PACKAGES_SERVICE_URL}
      - APP_GEOCODING_URL=${GEOCODING_SERVICE_URL}
      - KEYCLOAK_URI=${KEYCLOAK_URI}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URI}
    depends_on:
      - fleets-service
      - routes-service
      - auth-service
      - packages-service
      - geocoding-service
    networks:
      - backend-network
    restart: unless-stopped

  # ================================================================
  # 2. AUTH SERVICE (ms-auth)
  # ================================================================
  # Responsibilities:
  #   - User authentication
  #   - JWT token issuance and refresh
  #   - Integration with Keycloak (OAuth2)
  #   - Role and permission management
  # ================================================================
  auth-service:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:authdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - KEYCLOAK_URI=${KEYCLOAK_URI}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
    networks:
      - backend-network
    restart: unless-stopped

  # ================================================================
  # 3. FLEETS SERVICE (ms-fleets)
  # ================================================================
  # Responsibilities:
  #   - Vehicle CRUD operations
  #   - Category CRUD operations
  #   - Capacity management (weight, volume)
  #   - Vehicle status (AVAILABLE, IN_TRANSIT, etc.)
  # ================================================================
  fleets-service:
    build:
      context: ./ms-fleets
      dockerfile: Dockerfile
    container_name: fleets-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:logisticadb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - LOGGING_LEVEL_COM_FLEETS=DEBUG
    networks:
      - backend-network
    restart: unless-stopped

  # ================================================================
  # 4. ROUTES SERVICE (ms-routes)
  # ================================================================
  # Responsibilities:
  #   - Route CRUD operations
  #   - Leg (tramo) CRUD operations
  #   - Distance calculation (GeocodingService)
  #   - Vehicle and package validation
  #   - Shipment orchestration
  # ================================================================
  routes-service:
    build:
      context: ./ms-routes
      dockerfile: Dockerfile
    container_name: routes-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:routesdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - APP_CLIENTS_FLEETS_URL=${FLEETS_SERVICE_URL}
      - APP_CLIENTS_PACKAGES_URL=${PACKAGES_SERVICE_URL}
      - APP_CLIENTS_GEOCODING_URL=${GEOCODING_SERVICE_URL}
      - LOGGING_LEVEL_COM_ROUTES=DEBUG
    depends_on:
      - fleets-service
      - packages-service
      - geocoding-service
    networks:
      - backend-network
    restart: unless-stopped

  # ================================================================
  # 5. PACKAGES SERVICE (ms-packages)
  # ================================================================
  # Responsibilities:
  #   - Package CRUD operations
  #   - Package status management (CREATED, PROCESSING, READY_FOR_PICKUP, etc.)
  #   - Total weight/volume calculation
  #   - Store management
  #   - Package tracking
  # ================================================================
  packages-service:
    build:
      context: ./ms-packages
      dockerfile: Dockerfile
    container_name: packages-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:packagesdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - LOGGING_LEVEL_COM_PACKAGES=DEBUG
    networks:
      - backend-network
    restart: unless-stopped

  # ================================================================
  # 6. GEOCODING SERVICE (ms-geocoding)
  # ================================================================
  # Responsibilities:
  #   - Distance calculation between two coordinates
  #   - Estimated travel time calculation
  #   - Integration with OSRM (Open Source Routing Machine)
  #   - Batch processing for multiple location pairs
  # ================================================================
  geocoding-service:
    build:
      context: ./ms-geocoding
      dockerfile: Dockerfile
    container_name: geocoding-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - OSRM_URL=${OSRM_URL:-http://router.project-osrm.org}
      - LOGGING_LEVEL_COM_GEOCODING=DEBUG
    networks:
      - backend-network
    restart: unless-stopped

