# ================================================================
# APPLICATION - ms-fleets (Test configuration)
# ================================================================
# Used when running integration tests with the "test" profile.
# ================================================================

spring:
  # ================================================================
  # DATASOURCE - H2 in-memory for tests
  # ================================================================
  datasource:
    url: jdbc:h2:mem:fleets_test_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # ================================================================
  # JPA - Hibernate configuration for tests
  # ================================================================
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  # ================================================================
  # H2 Console - Disabled in tests
  # ================================================================
  h2:
    console:
      enabled: false

# ================================================================
# LOGGING - Minimal logging for tests
# ================================================================
logging:
  level:
    com.fleets: WARN
    org.springframework: WARN
  # file:
  #  name: logs/ms-fleets-test.log