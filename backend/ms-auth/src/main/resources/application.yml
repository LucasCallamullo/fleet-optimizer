# ================================================================
# APPLICATION - ms-auth (Simplified)
# ================================================================
# This service does NOT use a database.
# All authentication is handled by Keycloak via WebClient.
# ================================================================

server:
  port: 8083

spring:
  application:
    name: ms-auth

# ================================================================
# -- OAuth - KEYCLOAK CONFIGURATION
# ================================================================
app:
  # this use credentials .env
  auth0:
    domain: ${AUTH0_DOMAIN:https://dev-ejieic4zageec10c.us.auth0.com}
    client-id: ${AUTH0_CLIENT_ID}
    client-secret: ${AUTH0_CLIENT_SECRET}
    # Audience for Management API (M2M)
    audience: ${AUTH0_AUDIENCE:https://dev-ejieic4zageec10c.us.auth0.com/api/v2/}
    # Audience for user login (business API)
    login-audience: ${AUTH0_LOGIN_AUDIENCE:https://fleetoptimizer.com/api}
    jwks-uri: ${AUTH0_JWKS_URI:https://dev-ejieic4zageec10c.us.auth0.com/.well-known/jwks.json}

  # this use credentials .env
  keycloak:
    uri: ${KEYCLOAK_URI:https://labsys.frc.utn.edu.ar/aim}
    realm: ${KEYCLOAK_REALM:dds-materia}
    client-id: ${KEYCLOAK_CLIENT_ID:tpi-dds-client}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:tpi-dds-client}
    admin-user: ${KEYCLOAK_ADMIN_USER:Dds-admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:dds12345}
    jwks-uri: ${KEYCLOAK_URI}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

# ================================================================
# LOGGING - Debug for development
# ================================================================
logging:
  level:
    com.auth: DEBUG
    org.springframework.web.reactive.function.client: DEBUG