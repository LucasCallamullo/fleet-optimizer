# ================================================================
# APPLICATION - ms-routes (Base configuration)
# ================================================================
# This is the base configuration used for local development.
# Values here are overridden by application-docker.yml when
# the "docker" profile is active.
# ================================================================

server:
  port: 8082

# ================================================================
# EXTERNAL SERVICES CONFIGURATION
# ================================================================
app:
  clients:
    fleets:
      url: ${FLEETS_SERVICE_URL:http://localhost:8081}
    packages:
      url: ${PACKAGES_SERVICE_URL:http://localhost:8084}
    geocoding:
      url: ${GEOCODING_SERVICE_URL:http://localhost:8085}

spring:
  application:
    name: ms-routes

  # ================================================================
  # DATASOURCE - H2 for local development
  # ================================================================
  datasource:
    url: jdbc:h2:mem:routesdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # ================================================================
  # JPA - Hibernate configuration
  # ================================================================
  jpa:
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ================================================================
  # H2 Console - Enabled for local development
  # ================================================================
  h2:
    console:
      enabled: true
      path: /h2-console

# ================================================================
# LOGGING CONFIGURATION
# ================================================================
logging:
  level:
    com.routes.controller: WARN
    com.routes.filter: INFO

  pattern:
    # Console output - without %highlight to avoid conflict with filter colors
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %-5level - %msg%n"
    # File output format (more detailed for debugging)
    file: "%d{yyyy-MM-dd HH:mm:ss} - %level - [%thread] - %logger{36} - %msg%n%n"

  # ================================================================
  # FILE APPENDER (Persistent logs)
  # ================================================================
  # Commented out by default - uncomment to enable file logging.
  # ================================================================
  # file:
  #   name: logs/ms-routes.log
  #   max-size: 10MB
  #   max-history: 7